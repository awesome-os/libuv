name: Release awesome-os/libuv (4-OS)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build libuv-windows-x64.dll + C11 smoke test
        shell: pwsh
        run: |
          node scripts/build-zig-cc.mts --target win64 --out dist --smoke
          Copy-Item dist/libuv.dll dist/libuv-windows-x64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libuv-windows-x64
          path: |
            dist/libuv-windows-x64.dll
            dist/libuv.dll.a

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build libuv-linux-x64.so + libuv-linux-arm64.so + C11 smoke test
        run: |
          node scripts/build-zig-cc.mts --target linux-x64,linux-arm64 --out dist --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: libuv-linux
          path: |
            dist/libuv-linux-x64.so
            dist/libuv-linux-arm64.so

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build libuv-macos-arm64.dylib + C11 smoke test
        run: |
          mkdir -p dist
          clang -O2 -fPIC -fvisibility=hidden -std=gnu11 -fno-strict-aliasing \
            -shared -Wl,-install_name,@rpath/libuv.1.dylib \
            -Iinclude -Isrc \
            -DBUILDING_UV_SHARED=1 -D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE \
            -D_DARWIN_UNLIMITED_SELECT=1 -D_DARWIN_USE_64_BIT_INODE=1 \
            src/alloc.c src/b8g_libuv.c src/fs-common.c src/fs-poll.c src/idna.c \
            src/inet.c src/net-common.c src/random.c src/strscpy.c src/strtok.c \
            src/thread-common.c src/threadpool.c src/timer.c src/uv-common.c \
            src/uv-data-getter-setters.c src/version.c \
            src/unix/async.c src/unix/core.c src/unix/dl.c src/unix/fs.c \
            src/unix/getaddrinfo.c src/unix/getnameinfo.c src/unix/loop-watcher.c \
            src/unix/loop.c src/unix/pipe.c src/unix/poll.c src/unix/process.c \
            src/unix/random-devurandom.c src/unix/signal.c src/unix/stream.c \
            src/unix/tcp.c src/unix/thread.c src/unix/tty.c src/unix/udp.c \
            src/unix/bsd-ifaddrs.c src/unix/darwin.c src/unix/darwin-proctitle.c \
            src/unix/fsevents.c src/unix/kqueue.c src/unix/proctitle.c \
            src/unix/random-getentropy.c \
            -lpthread -o dist/libuv-macos-arm64.dylib
          strip -x dist/libuv-macos-arm64.dylib
          clang -O2 -std=c11 -Iinclude src/b8g_libuv_smoke.c dist/libuv-macos-arm64.dylib \
            -Wl,-rpath,@executable_path -o dist/b8g_libuv_smoke
          ./dist/b8g_libuv_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: libuv-macos-arm64
          path: dist/libuv-macos-arm64.dylib

  release:
    needs: [build-windows-x64, build-linux, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "awesome-os/libuv ${GITHUB_REF_NAME}" \
            --notes "Shared MIT libuv async I/O substrate for Awesome-OS with B8G_ABI_MAGIC_V3 (0x33564742)."
